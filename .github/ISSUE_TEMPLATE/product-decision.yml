name: Product decision
description: Escalate a product ambiguity that requires a human decision before work can continue.
title: "[DECISION] "
body:
  - type: textarea
    id: question
    attributes:
      label: Decision required
      description: State the exact product question that must be decided.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain why this decision is needed and link the affected work.
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: Options
      description: List materially distinct options without hiding important alternatives.
    validations:
      required: true

  - type: textarea
    id: impacts
    attributes:
      label: Impacts and trade-offs
      description: Describe consequences, risks and dependencies of the options.
    validations:
      required: true

  - type: textarea
    id: recommendation
    attributes:
      label: Agent analysis or recommendation
      description: Optional. Agents may analyze and recommend, but the human makes the product decision.

  - type: textarea
    id: resolution
    attributes:
      label: Human resolution
      description: Filled after the Product Owner decides. The durable result must also be reflected in the canonical project artifact.
