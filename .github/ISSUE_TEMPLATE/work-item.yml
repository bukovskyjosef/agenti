name: Work item
description: Capture work in Intake and refine the same issue through Analysis to Ready.
title: "[TASK] "
body:
  - type: input
    id: lifecycle
    attributes:
      label: Lifecycle state
      description: New work starts as Intake. Change this field in the issue body to Analysis and later Ready only according to docs/issue-standard.md.
      value: Intake
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What result is being requested? Intake may be incomplete, but the goal must be identifiable.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Minimum context needed to understand why this work exists. Link canonical sources instead of copying them.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Required before Ready. What is explicitly part of this task?

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Required before Ready. What must not be changed as part of this task?

  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: Required before Ready where applicable. Normative requirements or links to their canonical locations.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Required before Ready. Observable and testable completion conditions.

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Required before Ready for implementation/change work. State relevant constraints or explicitly state that there are none.

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Required before Ready. List dependencies and their state, or explicitly state that there are no blocking dependencies.

  - type: textarea
    id: references
    attributes:
      label: Canonical references
      description: Required before Ready. Files, decisions, issues or contracts authoritative for this task.

  - type: dropdown
    id: role
    attributes:
      label: Responsible role
      description: Must be selected before Ready. It may remain unset during early Intake/Analysis.
      options:
        - Orchestrator
        - Analyst
        - Asistentka
        - Developer
        - Tester
        - Reviewer

  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Required before Ready. How must the result be verified?

  - type: textarea
    id: documentation
    attributes:
      label: Documentation impact
      description: Required before Ready where applicable. Which canonical documents must change, or why no documentation update is needed.

  - type: checkboxes
    id: ready
    attributes:
      label: Ready checklist
      description: Leave incomplete during Intake/Analysis. Before changing Lifecycle state to Ready, every applicable condition from docs/issue-standard.md must be satisfied; this checklist is operational, while the document remains canonical.
      options:
        - label: Goal is unambiguous.
        - label: Scope and out-of-scope are explicit.
        - label: No unresolved product decision is required before this work can start.
        - label: Acceptance criteria are testable.
        - label: All mandatory contract sections relevant to this work are complete, including Constraints for implementation/change work.
        - label: Relevant canonical references are listed.
        - label: Dependencies are satisfied or clearly declared.
        - label: Responsible role is known.
        - label: A new competent agent can start from this issue and the repository without external chat context.
