name: Work item
description: Capture work in Intake and refine the same issue through Analysis, Ready, execution, control gates and Done.
title: "[TASK] "
body:
  - type: input
    id: lifecycle
    attributes:
      label: Lifecycle state
      description: New work starts as Intake. Update the issue body as work moves through Analysis, Blocked, Ready, In Progress, In Review, Changes Required, Approved and Done according to docs/issue-standard.md.
      value: Intake
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What result is being requested? Intake may be incomplete, but the goal must be identifiable.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Minimum context needed to understand why this work exists. Link canonical sources instead of copying them.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Required before Ready. What is explicitly part of this task?

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Required before Ready. What must not be changed as part of this task?

  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: Required before Ready where applicable. Normative requirements or links to their canonical locations.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Required before Ready. Observable and testable completion conditions.

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Required before Ready for implementation/change work. State relevant constraints or explicitly state that there are none.

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Required before Ready. List dependencies and their state, or explicitly state that there are no blocking dependencies.

  - type: textarea
    id: references
    attributes:
      label: Canonical references
      description: Required before Ready. Files, decisions, issues or contracts authoritative for this task.

  - type: dropdown
    id: role
    attributes:
      label: Responsible role
      description: Must be selected before Ready. It may remain unset during early Intake/Analysis.
      options:
        - Orchestrator
        - Analyst
        - Asistentka
        - Developer
        - Tester
        - Reviewer
        - Integrator

  - type: textarea
    id: gates
    attributes:
      label: Required control gates
      description: Required before Ready. Explicitly state required gates from docs/issue-standard.md, for example Independent Review; Independent Review + Test/Verification; explicitly permitted combined Review + Verification; or None for a work type that requires no additional gate.

  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Required before Ready. How must the result be verified?

  - type: textarea
    id: documentation
    attributes:
      label: Documentation impact
      description: Required before Ready where applicable. Which canonical documents must change, or why no documentation update is needed.

  - type: dropdown
    id: concurrency
    attributes:
      label: Concurrency class
      description: Required before Ready. See docs/issue-standard.md. Choose based on overlap/shared-contract risk, not business priority.
      options:
        - PARALLEL_SAFE
        - COORDINATION_REQUIRED
        - EXCLUSIVE

  - type: textarea
    id: shared_surfaces
    attributes:
      label: Shared surfaces / coordination rule
      description: Required before Ready. Name schema/API/domain/governance/dependency/file surfaces that may conflict and state ownership, sequencing or merge order. Write None for an isolated PARALLEL_SAFE task.
      placeholder: |
        Surface: ...
        Coordination/merge order: ...

  - type: textarea
    id: decision_gates
    attributes:
      label: Decision gates
      description: Required before Ready. List unresolved product/governance/architecture questions, or write None. A task cannot be Ready while a decision needed to execute its scope is unresolved.
      placeholder: None

  - type: checkboxes
    id: ready
    attributes:
      label: Ready checklist
      description: Leave incomplete during Intake/Analysis. Before changing Lifecycle state to Ready, every applicable condition from docs/issue-standard.md must be satisfied; this checklist is operational, while the document remains canonical.
      options:
        - label: Goal is unambiguous.
        - label: Scope and out-of-scope are explicit.
        - label: No unresolved decision gate required for execution remains.
        - label: Acceptance criteria are testable.
        - label: All mandatory contract sections relevant to this work are complete, including Constraints for implementation/change work.
        - label: Relevant canonical references are listed.
        - label: Dependencies are satisfied or clearly declared.
        - label: Responsible role is known.
        - label: Required control gates are explicitly declared.
        - label: Concurrency class is explicitly declared.
        - label: Shared surfaces / coordination rule are explicit or None.
        - label: A new competent agent can start from this issue and the repository without external chat context.
